<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GatePass QR System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'dashboard' %}">GatePass QR</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{% url 'register_visitor' %}">Register</a>
        <a class="nav-link" href="{% url 'approval_queue' %}">Approvals</a>
        <a class="nav-link" href="{% url 'scan_qr' %}">Scan</a>
        <a class="nav-link" href="{% url 'visitor_logs' %}">Logs</a>
        <a class="nav-link" href="{% url 'logout' %}">Logout</a>
      </div>
    </div>
  </nav>
  <main class="container">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
