{% extends "base.html" %}
{% block content %}
<h3>Review Pass #{{ pass.id }}</h3>
<p><b>{{ pass.visitor_name }}</b> wants to meet <b>{{ pass.host.username }}</b>.</p>
<form method="post" class="card card-body">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-success">Submit Decision</button>
</form>
{% endblock %}
