{% extends "base.html" %}
{% block content %}
<h3>Approval Queue</h3>
<table class="table table-bordered table-sm">
  <tr><th>ID</th><th>Visitor</th><th>Host</th><th>Purpose</th><th>Action</th></tr>
  {% for p in passes %}
  <tr>
    <td>{{ p.id }}</td>
    <td>{{ p.visitor_name }}</td>
    <td>{{ p.host.username }}</td>
    <td>{{ p.purpose|truncatechars:50 }}</td>
    <td><a class="btn btn-sm btn-primary" href="{% url 'review_pass' p.id %}">Review</a></td>
  </tr>
  {% empty %}
  <tr><td colspan="5">No pending records.</td></tr>
  {% endfor %}
</table>
{% endblock %}
